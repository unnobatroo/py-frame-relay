[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-frame-relay"
version = "0.1.0"
description = "Single-threaded, epoll-based TCP telemetry collector with CRC-checked framing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
py-frame-relay = "py_frame_relay.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_frame_relay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
