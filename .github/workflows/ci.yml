name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest  # real Linux, so DefaultSelector is epoll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: pytest -v
